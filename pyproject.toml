[project]
name = "jcyber"
version = "0.0.0"
description = "MCP toolkit for agent-driven pentesting. The agent harness is the brain; Jcyber provides scope-gated tools, evidence graph, and finding lifecycle."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jcyber contributors" }]
keywords = [
    "offensive-security",
    "pentest",
    "bug-bounty",
    "red-team",
    "security",
    "mcp",
    "agent",
    "memgraph",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",          # MCP server (FastMCP) — the primary interface
    "neo4j>=5",           # Memgraph session brain (Bolt); Memgraph is Bolt-compatible
    "httpx>=0.27",        # HexStrike REST, Caido API, TencentDB HTTP seam
    "python-dotenv>=1.0", # Load .env (secrets live there, not in process env)
]

[project.urls]
Repository = "https://github.com/i098/Jcyber"

[project.scripts]
jcyber = "jcyber.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "sentrux>=0.1.6",
    "pyrefly>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyrefly]
project-includes = [
    "jcyber",
    "tests",
]
python-version = "3.12.0"
infer-with-first-use = false
